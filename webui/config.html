<html>
<head>
    <title>Honcho Shared Memory</title>
    <script type="module">
        import { apiRequest } from "/js/api.js";
        import { toastFrontendSuccess, toastFrontendError, toastFrontendWarning } from "/components/notifications/notification-store.js";
        window._honcho = { apiRequest, toastFrontendSuccess, toastFrontendError, toastFrontendWarning };
    </script>
</head>

<body>
    <div x-data="{
        secretStatus: 'Checking...',
        diagnostics: null,

        init() {
            this.checkSecretStatus();
        },

        async checkSecretStatus() {
            try {
                const res = await window._honcho.apiRequest('GET', '/api/plugins/honcho_shared_memory/secret_status');
                if (res.ok) {
                    const data = await res.json();
                    this.secretStatus = data.configured ? '✅ Configured' : '❌ Missing';
                } else {
                    this.secretStatus = '⚠️ Unknown';
                }
            } catch {
                this.secretStatus = '⚠️ Error checking';
            }
        },

        async testConnection() {
            window._honcho.toastFrontendWarning('Testing connection...', 'Honcho');
            try {
                const res = await window._honcho.apiRequest('POST', '/api/plugins/honcho_shared_memory/test_connection');
                const data = await res.json();
                this.diagnostics = data;
                if (data.success) {
                    window._honcho.toastFrontendSuccess(data.message || 'Connection successful', 'Honcho');
                } else {
                    window._honcho.toastFrontendError(data.message || 'Connection failed', 'Honcho');
                }
            } catch (e) {
                window._honcho.toastFrontendError('Connection test error: ' + e.message, 'Honcho');
            }
        },

        viewDiagnostics() {
            if (this.diagnostics) {
                const diagText = JSON.stringify(this.diagnostics, null, 2);
                window._honcho.toastFrontendWarning('Diagnostics: \n' + diagText, 'Honcho');
            } else {
                window._honcho.toastFrontendWarning('No diagnostics available. Run Test Connection first.', 'Honcho');
            }
        },

        resetDefaults() {
            if (confirm('Reset all settings to defaults?')) {
                document.dispatchEvent(new CustomEvent('honcho-reset'));
                window._honcho.toastFrontendWarning('Settings reset requested. Save to persist.', 'Honcho');
            }
        }
    }">
        <template x-if="config">
            <div>
                <div class="section-title">Honcho Shared Memory</div>
                <div class="section-description">
                    Shared persistent memory through a self-hosted Honcho database.
                </div>

                <!-- Authentication -->
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Secret Name: HONCHO_DB_PASSWORD</div>
                        <div class="field-description">
                            Status of the Honcho DB password secret.
                        </div>
                    </div>
                    <div class="field-control">
                        <span class="field-status-text" style="font-size: 0.9rem;" x-text="secretStatus">Checking...</span>
                    </div>
                </div>

                <!-- Connection -->
                <div class="section-title">Connection</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Honcho Base URL</div>
                        <div class="field-description">
                            Full URL of your Honcho API (e.g., http://your-server:8000).
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.honcho_base_url" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Connection Mode</div>
                        <div class="field-description">
                            Local (same machine), LAN (local network), or Remote (private server).
                        </div>
                    </div>
                    <div class="field-control">
                        <select x-model="config.connection_mode">
                            <option value="local">Local</option>
                            <option value="lan">LAN</option>
                            <option value="remote">Remote / Private Server</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Request Timeout (seconds)</div>
                        <div class="field-description">
                            Maximum time to wait for Honcho API responses.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" x-model.number="config.request_timeout" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Max Retries</div>
                        <div class="field-description">
                            Number of times to retry failed requests.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" x-model.number="config.max_retries" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">TLS Verify</div>
                        <div class="field-description">
                            Verify SSL/TLS certificates when connecting.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.tls_verify" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <!-- Workspace & Identity -->
                <div class="section-title">Workspace & Identity</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Honcho Workspace ID</div>
                        <div class="field-description">
                            The workspace identifier in your Honcho instance.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.honcho_workspace_id" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Honcho Peer ID</div>
                        <div class="field-description">
                            The peer identifier for this workspace.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.honcho_peer_id" />
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Current Agent ID</div>
                        <div class="field-description">
                            Unique identifier for this Agent Zero instance.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.agent_id" />
                    </div>
                </div>

                <!-- Actions -->
                <div class="section-title">Actions</div>
                <div class="field" style="display:flex; gap:10px;">
                    <button class="btn btn-field" @click="testConnection()">Test Connection</button>
                    <button class="btn btn-field" @click="viewDiagnostics()">View Diagnostics</button>
                    <button class="btn btn-field" @click="resetDefaults()">Reset to Defaults</button>
                </div>

                <!-- Multi-Agent -->
                <div class="section-title">Multi-Agent</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Enable multi-agent shared memory</div>
                        <div class="field-description">
                            Allow multiple agents to share the same Honcho workspace.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.multi_agent_mode" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field" x-show="config.multi_agent_mode">
                    <div class="field-label">
                        <div class="field-title">Allowed Agent IDs</div>
                        <div class="field-description">
                            Comma-separated list of agent IDs allowed in this workspace.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="text" x-model="config.allowed_agent_ids_string" placeholder="e.g. agent-zero-0, agent-zero-1" />
                    </div>
                </div>

                <!-- Automation & Privacy -->
                <div class="section-title">Automation & Privacy</div>
                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto Retrieval</div>
                        <div class="field-description">
                            Automatically retrieve relevant Honcho memories at the start of each turn.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.auto_retrieval" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Auto Store</div>
                        <div class="field-description">
                            ⚠️ Automatically store conversation messages in Honcho.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.auto_store" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Store User Messages</div>
                        <div class="field-description">
                            Store user prompt messages when auto-store is enabled.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.store_user_messages" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Store Assistant Messages</div>
                        <div class="field-description">
                            Store assistant response messages when auto-store is enabled.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.store_assistant_messages" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Store Tool Output</div>
                        <div class="field-description">
                            Store tool execution results when auto-store is enabled.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.store_tool_output" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Redact Secrets Before Store</div>
                        <div class="field-description">
                            Filter out passwords, tokens, and keys before storing.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.redact_secrets_before_store" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <div class="field-title">Max Stored Content Length</div>
                        <div class="field-description">
                            Maximum characters to store per memory entry.
                        </div>
                    </div>
                    <div class="field-control">
                        <input type="number" x-model.number="config.max_stored_content_length" />
                    </div>
                </div>

                <div class="field" x-show="config.multi_agent_mode">
                    <div class="field-label">
                        <div class="field-title">Include Shared Agent Memories</div>
                        <div class="field-description">
                            Retrieve memories from other agents in multi-agent mode.
                        </div>
                    </div>
                    <div class="field-control">
                        <label class="toggle">
                            <input type="checkbox" x-model="config.include_shared_agent_memories" />
                            <span class="toggler"></span>
                        </label>
                    </div>
                </div>
            </div>
        </template>
    </div>
</body>
</html>
